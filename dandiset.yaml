dateCreated: '2026-07-13T17:34:18.533102+00:00'
description: "This dataset contains electrophysiological recordings for the Patch-seq
  analysis of Mus musculus locus coeruleus norepinephrine neurons using SMART-seq
  V4 sequencing of locus coeruleus (LC) norepinephrine neurons. These data are included
  in the publication 'Topographic structure and function of locus coeruleus norepinephrine
  neurons' by Su et al (2026): https://www.biorxiv.org/content/10.64898/2026.04.10.717727.
  Processing code is available at https://github.com/AllenNeuralDynamics/LCNE-patchseq-figures
  and https://github.com/AllenNeuralDynamics/LCNE-patchseq-analysis/"
